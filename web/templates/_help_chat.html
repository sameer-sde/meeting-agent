{# The help bot on the sign-in pages: fixed answers about Meeting Agent, no AI call, nothing is saved. #}
<style>
.cb-btn{position:fixed;right:22px;bottom:22px;z-index:50;width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:#1B1A17;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.cb-btn:hover{filter:brightness(1.06)}
.cb-btn svg{width:30px;height:30px}
.cb-btn .x{display:none;font:400 26px/1 Manrope,sans-serif}
.cb-open .cb-btn .bot{display:none}.cb-open .cb-btn .x{display:block}
.cb-win{position:fixed;right:22px;bottom:92px;z-index:50;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 120px);display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.55)}
.cb-open .cb-win{display:flex}
.cb-head{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.cb-face{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#1B1A17;display:grid;place-items:center}
.cb-face svg{width:22px;height:22px}
.cb-head b{display:block;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:18px;line-height:1.2}
.cb-head span{font-size:12px;color:var(--muted)}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto;padding:14px}
.msg{max-width:86%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:#1B1A17;border-bottom-right-radius:4px}
.msg.bot{white-space:pre-line;align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot.wait{display:flex;gap:5px;align-items:center;padding:14px}
.msg.bot.wait i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:cb-dot 1.2s infinite}
.msg.bot.wait i:nth-child(2){animation-delay:.2s}.msg.bot.wait i:nth-child(3){animation-delay:.4s}
@keyframes cb-dot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.msg.bot.wait i{animation:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{font:12px Manrope,sans-serif;color:var(--ink);background:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.send{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.send input{flex:1}
.send .btn{width:auto;margin:0}
.mic{flex:none;width:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;display:none;place-items:center}
.mic svg{width:18px;height:18px}
.mic.on{background:var(--stop);border-color:var(--stop);color:#fff;animation:cb-pulse 1.2s infinite}
@keyframes cb-pulse{50%{opacity:.6}}
.cb-voice{margin-left:auto;background:none;border:1px solid var(--line);border-radius:99px;color:var(--muted);font:12px Manrope,sans-serif;padding:4px 10px;cursor:pointer;display:none;white-space:nowrap}
.cb-voice.on{color:var(--ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
@media(max-width:520px){.cb-btn{right:14px;bottom:14px}.cb-win{left:8px;right:8px;bottom:82px;width:auto;max-width:none}}
</style>
{% set bot_icon %}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3"/><circle cx="12" cy="2.5" r="1" fill="currentColor"/><rect x="4" y="6" width="16" height="12" rx="4"/><circle cx="9" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/><path d="M9.5 15.2c1.5 1 3.5 1 5 0"/><path d="M2 11v3M22 11v3"/><path d="M9 18l-1.5 3 4-3"/></svg>{% endset %}
<div id="cb">
  <section class="cb-win" id="cb-win" aria-label="Meeting Agent help">
    <div class="cb-head"><span class="cb-face">{{ bot_icon }}</span><div><b>Meeting Agent help</b><span>Quick answers</span></div><button type="button" class="cb-voice" id="cb-voice" aria-pressed="false">🔈 Read aloud: off</button></div>
    <div class="msgs" id="msgs" aria-live="polite">
      <div class="msg bot">Hi 👋 How can I help you?<br>Tap a question, or type your own.</div>
    </div>
    <div class="chips" id="chips"></div>
    <form class="send" id="chatform">
      <button type="button" class="mic" id="mic" aria-label="Speak your question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <input type="text" id="question" maxlength="200" placeholder="Ask about Meeting Agent" aria-label="Your question" autocomplete="off">
      <button class="btn accent" id="askbtn">Send</button>
    </form>
  </section>
  <button class="cb-btn" id="cb-btn" type="button" aria-label="Open help chat" aria-expanded="false" aria-controls="cb-win"><span class="bot">{{ bot_icon }}</span><span class="x" aria-hidden="true">✕</span></button>
</div>
<script>
(function () {
  // Each entry: the question shown as a button, words that point to it when typed, and the answer.
  // q: shown as a button when chip is true.  k: words and phrases that point to this answer.
  // weak: words that point here only when no other answer matches.  low: a catch-all answer that loses to any real topic.
  // a: the answer.  more: what to say when the visitor then asks for "more".
  var FAQ = [
    {chip: true, q: 'What is Meeting Agent?', weak: ['meeting agent', 'this app', 'this site', 'this website', 'this tool'], k: ['feature', 'features', 'overview', 'what is this', 'what is it', 'what does it do', 'what does this do', 'what can it do', 'what it does', 'ye kya hai', 'yeh kya hai', 'kya hai ye', 'kya karta hai ye'],
     a: 'A bot joins your Microsoft Teams or Google Meet meeting and listens. After the meeting you get a report card: summary, decisions, action items and who said what. You also get the recording, a transcript you can search, a tasks list, and a chatbot you can ask about the meeting.',
     more: 'Here is everything a meeting gives you:\n• Report card by email and on your dashboard\n• Minutes of Meeting you can print as a PDF\n• Full transcript with search, and the audio recording\n• Chapters: the meeting split into topics\n• Who spoke how much, and whose name was mentioned\n• Attendance sheet you can download\n• A meeting score out of 10\n• Tasks page for every action item, and a tracker for promises made last time\n• A chatbot that answers questions about the meeting, by typing or voice'},
    {chip: true, q: 'How do I start?', k: ['start', 'begin', 'sign up', 'signup', 'register', 'new account', 'create account', 'create an account', 'how to use', 'how do i use', 'kaise', 'setup', 'set up', 'steps', 'get started'],
     a: 'Press "Create an account" and confirm your email with the 6-digit code we send. The Set up page then walks you through it: add two free keys from Vexa (the service the bot runs on), paste a meeting link, and press Send bot. It takes about 5 minutes.',
     more: 'Step by step:\n1. Create an account and enter the code from your email.\n2. Make a free account on Vexa and create two keys there: a Bot key and a Transcription key.\n3. Paste both keys on the Set up page.\n4. Start or open a Teams or Google Meet meeting and copy its link.\n5. Paste the link in "Join now" and press Send bot.\n6. Let the bot in when it asks to join.\n7. When the meeting ends, the report arrives in a few minutes.\nConnecting Telegram and a calendar is optional.'},
    {chip: true, q: 'Is it free?', k: ['free', 'chatbot free', 'is the chatbot free', 'price', 'pricing', 'cost', 'costs', 'pay', 'paid', 'payment', 'money', 'charge', 'charges', 'plan', 'paisa', 'rupees', 'kitna', 'subscription'],
     a: 'Meeting Agent itself is free. The bot runs on Vexa, and every new Vexa account gets about 4 hours of meetings free. After that, Vexa charges roughly half a dollar per meeting hour, paid to Vexa on your own account.',
     more: 'There is no card to enter and nothing to pay to Meeting Agent. Each person uses their own Vexa account, so nobody shares a bill. When the free Vexa credit is used up, the bot simply stops joining until that Vexa account is topped up; your old reports stay.'},
    {chip: true, q: 'Which meetings and languages?', k: ['language', 'languages', 'hindi', 'telugu', 'english', 'hinglish', 'urdu', 'tamil', 'teams', 'google meet', 'zoom', 'webex', 'which meetings', 'platform', 'platforms', 'support', 'supports', 'supported'],
     a: 'It works with Microsoft Teams and Google Meet. It understands Hindi, Telugu and English, even when they are mixed in one sentence, and writes the report in English. The chatbot can answer in the language you ask in.',
     more: 'Zoom and other meeting apps are not supported yet. When you send the bot you can choose "English" (everything is translated to English) or "Original" (the transcript stays in the language spoken). The report card is always written in English.'},
    {chip: true, q: 'Is my meeting private?', k: ['private', 'privacy', 'safe', 'secure', 'security', 'my data', 'confidential', 'who can see', 'delete', 'encrypted', 'trust'],
     a: 'Only you can see your meetings, and your Vexa keys are stored encrypted. You can delete any meeting, or your whole account, at any time. The bot joins as a visible participant, so everyone in the call knows it is there. The audio is handled by Vexa and the report is written with Google Gemini, so please do not use it for confidential meetings.',
     more: 'A few more details: passwords and sign-in codes are stored only as hashes, never as plain text. The bot says hello in the meeting chat so nobody is surprised. Deleting a meeting removes its report, transcript, tasks and chat from Meeting Agent; Vexa keeps its own copy in your Vexa account.'},
    {chip: true, q: 'Who built this?', k: ['who built', 'who made', 'who created', 'who is behind', 'who owns', 'built', 'made by', 'maker', 'developer', 'developed', 'creator', 'owner', 'founder', 'sameer', 'ahmed', 'your team', 'the team', 'kisne', 'banaya'],
     a: 'Meeting Agent was built by Sameer Ahmed and team, so you never miss a meeting. You can see the project on GitHub: github.com/sameer-sde/meeting-agent',
     more: 'Sameer built Meeting Agent so that people who miss a meeting still get the decisions and their tasks. The code is public on GitHub at github.com/sameer-sde/meeting-agent, where you can read how it works.'},
    {chip: true, q: "I can't sign in", k: ['sign in', 'signin', 'login', 'log in', 'password', 'forgot', 'otp', 'verification code', 'the code', 'cant', "can't", 'cannot', 'not working', 'continue with google', 'otp not', 'code not', 'no otp', 'no code', 'otp not received', 'code not received', 'did not get the code', 'didnt get the code', 'google sign in', 'google login'],
     a: 'If you forgot your password, press "Forgot password?" and we email you a 6-digit code. If the code email does not arrive, check your Spam or Junk folder. If "Continue with Google" shows an error, use "Create an account" with your email instead.',
     more: 'The code is valid for 15 minutes and allows 5 tries. You can ask for a new code after 45 seconds. If you first signed in with Google, the same email works with a password too: use "Forgot password?" once to set one.'},
    {low: true, q: 'Everything', k: ['everything', 'every thing', 'tell me everything', 'tell me all', 'all about', 'all of it', 'all features', 'full details', 'complete details', 'in detail', 'whole thing', 'sab kuch', 'sab batao', 'sab', 'poora', 'pura'],
     a: 'Here is everything in short.\n\nMeeting Agent sends a bot into your Microsoft Teams or Google Meet meeting. It listens, in Hindi, Telugu, English or a mix, and afterwards gives you:\n• A report card: summary, decisions, action items, who said what\n• Minutes of Meeting you can print as a PDF\n• The full transcript with search, and the audio recording\n• Chapters, who spoke how much, and an attendance sheet\n• A meeting score out of 10\n• One Tasks page for every action item, and a tracker for promises made last time\n• A chatbot that answers questions about the meeting, by typing or voice\n\nIt is free to start, and it was built by Sameer Ahmed and team. Ask me about any one of these to know more, for example "how do I start" or "is it free".',
     more: 'To go deeper, pick a topic: how to start, the cost, languages, privacy, how the bot joins, the report card, the recording, tasks, the chatbot, Telegram and calendar.'},
    {q: 'The chatbot', k: ['chatbot', 'chat bot', 'ask questions', 'voice', 'speak', 'talk to', 'assistant'],
     a: 'After you sign in, a chatbot sits in the corner of every page. Ask it anything about a meeting, by typing or by voice, in English, Hinglish, Hindi or Telugu. It shows the exact lines from the meeting as proof.',
     more: 'It can also do things for you after you press Confirm: mark a task as done, rename a meeting, email a report to someone, or send the bot to a meeting. While a meeting is still running you can ask it "what have I missed so far?".'},
    {q: 'How the bot joins', k: ['bot join', 'bot joins', 'the bot', 'join the meeting', 'how does it join', 'admit', 'notetaker', 'everyone see', 'visible', 'record without'],
     a: 'The bot joins like a normal participant with a name such as "Sameer\'s Notetaker". Someone in the meeting lets it in. It says hello in the chat, then only listens. It leaves when the meeting ends or when you press Stop bot.',
     more: 'You can send the bot three ways: paste a link and press Send bot, schedule it for a time, or connect your calendar so it joins every meeting that has a link. A switch in Settings decides whether it also joins when you attend yourself.'},
    {q: 'Recording and transcript', k: ['recording', 'record', 'audio', 'video', 'transcript', 'playback', 'listen again'],
     a: 'Each report has a full transcript with speaker names and times, which you can search and download. When Vexa keeps the audio, you can also play the meeting back and jump to any line. Video is not recorded.',
     more: 'Clicking a time in the transcript plays that moment. The Speakers view shows who spoke when across the meeting.'},
    {q: 'Tasks', k: ['task', 'tasks', 'action item', 'action items', 'to do', 'todo', 'follow up', 'promise', 'deadline'],
     a: 'Every action item from every meeting lands on one Tasks page, with its owner and due date, and a tick box to mark it done. For repeat meetings, a promise tracker shows which of last time\'s tasks were done, are in progress, are stuck, or were not mentioned.'},
    {q: 'How long it takes', k: ['how long does', 'how long will', 'how fast', 'how soon', 'when will', 'wait', 'time taken', 'kitni der', 'kitna time', 'kab aati', 'kab aayegi', 'kab milegi'],
     a: 'The report card usually arrives about 2 minutes after the bot leaves the meeting, by email and on your dashboard.'},
    {q: 'Telegram and calendar', k: ['telegram', 'calendar', 'outlook', 'google calendar', 'schedule', 'auto join', 'automatic', 'reminder', 'brief'],
     a: 'Both are optional. With a calendar connected, the bot joins every meeting that has a link. With Telegram connected, it asks before each meeting whether you are joining, and sends a short brief about 10 minutes before: last time\'s decisions and your open tasks.'},
    {q: 'Phone', k: ['phone', 'mobile', 'android', 'iphone', 'ios', 'play store', 'download app', 'install'],
     a: 'There is nothing to install. Meeting Agent is a website and works in the browser on a laptop or a phone.'},
    {q: 'Do I have to be in the meeting?', k: ['without me', 'not there', 'if i miss', 'i miss', 'missed', 'absent', 'in my place', 'on my behalf', 'do i need to join', 'do i have to join', 'need to attend', 'attend for me', 'do i need to be', 'need to be in', 'have to be in', 'be present', 'have to attend', 'mujhe join'],
     a: 'No. That is the main idea. The bot attends in your place, and you read the report card afterwards. You can also attend yourself and still let the bot take the notes.'},
    {q: 'Do people know it is recording?', k: ['consent', 'permission', 'legal', 'allowed', 'is it legal', 'legal to record', 'allowed to record', 'illegal', 'know it is recording', 'secretly', 'secret', 'hidden', 'do people know', 'does everyone know', 'inform'],
     a: 'The bot never joins secretly. It is a visible participant with a name like "Sameer\'s Notetaker", someone has to let it in, and it says hello in the meeting chat. Whether recording is allowed depends on your company\'s rules and your local law, so tell everyone in the meeting first and get their agreement.'},
    {q: 'Stopping or removing the bot', k: ['stop the bot', 'remove the bot', 'kick', 'remove it', 'stop recording', 'leave the meeting', 'how to stop', 'pull the bot'],
     a: 'Press "Stop bot" on your dashboard and it leaves at once. The meeting host can also remove it like any participant. It leaves by itself when the meeting ends, or after about 10 minutes of silence.'},
    {q: 'The bot did not join', k: ['did not join', 'didnt join', "didn't join", 'not joining', 'bot not coming', 'bot is not', 'not joined', 'bot failed', 'waiting room', 'lobby', 'join nahi', 'nahi aa raha', 'nahi aaya', 'join nhi'],
     a: 'Check four things: 1) someone admitted the bot from the lobby, 2) the meeting link is complete, 3) your two Vexa keys are saved in Settings, 4) your Vexa account still has credit. If the bot waits about 5 minutes in the lobby without being admitted, it gives up.'},
    {q: 'The report did not come', k: ['no report', 'report not', 'did not get', 'didnt get', "didn't get", 'not received', 'no email', 'email not', 'mail not', 'where is my report', 'report missing'],
     a: 'The report takes a few minutes after the bot leaves. Look on your dashboard under Report cards, and check your Spam or Junk folder for the email. If nobody spoke in the meeting, there is nothing to report, so no report card is made.'},
    {q: 'How accurate is it?', k: ['accurate', 'accuracy', 'correct', 'mistake', 'mistakes', 'wrong', 'reliable', 'errors', 'trust the report'],
     a: 'It is good on clear audio. Names, numbers and mixed-language sentences can sometimes be heard wrong, like with any speech-to-text. The report only uses what was said and writes "None mentioned" instead of guessing. You can always check the full transcript and the recording.'},
    {q: 'What is a report card?', k: ['report card', 'summary', 'what do i get', 'what will i get', 'output', 'notes', 'what is in the report'],
     a: 'The report card is the short version of the meeting: a summary, the key decisions, the action items with owner and deadline, who said what, and the open questions. It comes by email and stays on your dashboard.'},
    {q: 'Minutes of Meeting', k: ['minutes of meeting', 'meeting minutes', 'mom', 'pdf', 'print', 'formal'],
     a: 'Every report has a "Minutes of Meeting" button. It opens a formal page with purpose, agenda, discussion, decisions and an action table, which you can save as a PDF from the browser\'s print option.'},
    {q: 'Attendance and participation', k: ['attendance', 'participation', 'who attended', 'who spoke', 'talk time', 'present', 'speakers', 'mentions', 'mentioned'],
     a: 'Each report shows who spoke and for how long, the share of talk time per person, how often each name was mentioned, and an attendance sheet you can download. It only knows people who spoke or were invited; a person who stayed silent cannot be detected.'},
    {q: 'Meeting score', k: ['score', 'rating', 'rate the meeting', 'how good', 'out of 10'],
     a: 'Each meeting gets a score out of 10. It is simple maths, not an opinion: how many decisions and tasks came out, how balanced the talking was, whether tasks have an owner and a date, and the length. It ends with one tip for next time.'},
    {q: 'Sharing a report', k: ['share', 'send to team', 'send report', 'forward', 'send to others', 'colleagues', 'send to my team', 'multiple emails'],
     a: 'Open a report and press "Share with attendees" to email it to people in that meeting or to any address. In Settings you can also list several email addresses that get every report automatically. They do not need an account.'},
    {q: 'Editing, renaming and deleting', k: ['edit', 'rename', 'change the name', 'change title', 'delete report', 'delete a report', 'delete the report', 'delete meeting', 'delete a meeting', 'delete the meeting', 'remove a meeting', 'remove report'],
     a: 'You can rename a meeting and you can delete it completely (report, transcript, tasks and chat). The text of a report card cannot be edited, but the Minutes of Meeting can be written again with one button.'},
    {q: 'When the free credit runs out', k: ['credit', 'credit is finished', 'credit finished', 'runs out', 'run out', 'used up', 'top up', 'recharge', 'after 4 hours', 'after the free'],
     a: 'When the free Vexa credit is used up, the bot stops joining new meetings until you add credit to your Vexa account. Your old reports stay as they are, and you do not need to change anything in Meeting Agent after topping up.'},
    {q: 'How long can a meeting be?', k: ['how long can', 'long meeting', 'maximum', 'max length', 'hours', 'time limit', 'duration limit'],
     a: 'Meeting Agent sets no time limit. A meeting uses your Vexa credit by the hour, so the free credit covers about 4 hours in total.'},
    {q: 'Does the bot talk?', k: ['does it talk', 'does it speak', 'bot talk', 'bot speak', 'answer in the meeting', 'reply in the meeting', 'interrupt', 'silent'],
     a: 'No. In the meeting the bot only listens. The one thing it posts is a short hello in the meeting chat when it joins, and you can switch that off in Settings. You ask your questions afterwards, in the chatbot inside the app.'},
    {q: 'Chat messages and screen sharing', k: ['screen share', 'screen sharing', 'shared screen', 'slides', 'presentation', 'meeting chat', 'chat messages', 'typed messages', 'whiteboard', 'files'],
     a: 'It captures what is spoken. It does not read messages typed in the meeting chat, and it does not record the shared screen, slides or files.'},
    {q: 'How is it different from Teams?', k: ['different', 'difference', 'better than', 'compare', 'copilot', 'why not teams', 'why use this', 'otter', 'fireflies', 'instead of'],
     a: 'It works on both Microsoft Teams and Google Meet, it understands Hindi, Telugu and English mixed together, and it is free to start. It also tracks whether last meeting\'s promises were kept, gives each meeting a score, and puts every task from every meeting on one page.'},
    {q: 'Who is it for?', k: ['who is it for', 'who can use', 'who should use', 'for companies', 'for students', 'for teams', 'for managers', 'use case', 'useful for'],
     a: 'Anyone who has more meetings than time: managers who cannot attend every call, team members who miss a standup, and anyone who wants decisions and tasks written down without taking notes.'},
    {q: 'Is it open source?', k: ['open source', 'opensource', 'source code', 'github', 'repository', 'repo'],
     a: 'Yes, the code is public on GitHub: github.com/sameer-sde/meeting-agent'},
    {q: 'Where is my data kept?', k: ['where is my data', 'data stored', 'stored', 'storage', 'how long is', 'kept for', 'database', 'server'],
     a: 'Your reports and transcripts are kept in Meeting Agent\'s database until you delete them. You can delete one meeting, or your whole account, at any time. The audio is kept by Vexa in your own Vexa account.'},
    {q: 'Deleting my account', k: ['delete my account', 'delete account', 'close account', 'close my account', 'remove my account', 'unsubscribe'],
     a: 'After signing in, open Settings and press "Delete my account" at the bottom. That removes your saved keys and all your report cards from Meeting Agent. Your Vexa account is separate and is not affected.'},
    {q: 'Changing my password or email', k: ['change password', 'change my password', 'reset password', 'new password', 'change email', 'change my email'],
     a: 'To set a new password, press "Forgot password?" on the sign-in page and enter the 6-digit code we email you. The account email itself cannot be changed; create a new account with the other email instead.'},
    {q: 'Help and contact', k: ['contact', 'support', 'help me', 'customer care', 'complaint', 'feedback', 'report a bug', 'bug', 'talk to someone', 'phone number', 'email id', 'whatsapp'],
     a: 'After you sign in, the Help page explains every part of the app. For a problem or an idea, please tell the person who shared Meeting Agent with you, or open an issue on GitHub: github.com/sameer-sde/meeting-agent'},
    {q: 'Does it need internet?', k: ['offline', 'without internet', 'no internet', 'internet'],
     a: 'Yes, it needs internet. Meeting Agent is a website and the bot joins online meetings.'},
    {q: 'What is Vexa?', k: ['vexa', 'keys', 'key', 'api key', 'bot key', 'transcription key'],
     a: 'Vexa is the service that puts the bot into the meeting and turns the speech into text. You make a free Vexa account and paste two keys from it on the Set up page. Your keys are stored encrypted and used only for your own meetings.'}
  ];
  var TALK = [
    [/^\s*(hi|hii+|hello|hey|namaste|salam|assalam\w*|good (morning|evening|afternoon))\b/i, 'Hi! Ask me anything about Meeting Agent, or tap one of the questions below.'],
    [/\b(thanks|thank you|thank u|thx|shukriya|dhanyavad)\b/i, 'Happy to help. Ask me anything else about Meeting Agent.'],
    [/\b(how are you|how r u|kaise ho|kya haal)\b/i, 'I am doing well, thank you. What would you like to know about Meeting Agent?'],
    [/\b(who are you|your name|what are you|are you (a )?(bot|human|ai|robot))\b/i, 'I am the Meeting Agent help bot. I answer questions about the app from a list of written answers. After you sign in, a smarter chatbot answers questions about your own meetings.'],
    [/^\s*(yes|yeah|yep|ya|sure|haan|ha|hmm|help|help me|anything|something|idk|i don'?t know|not sure|what can i ask|what can you do|options|menu)\W*$/i, 'Here is what I can tell you about: what Meeting Agent does, how to start, the cost, languages, privacy, how the bot joins, the report card, recording, tasks, the chatbot, and who built it. Tap a question below, or type "everything" for the full picture.'],
    [/^\s*(bye|goodbye|see you|ok|okay|nice|great|good|cool)\W*$/i, 'Glad that helped. I am here if you need anything else.']
  ];
  var cb = document.getElementById('cb'), toggle = document.getElementById('cb-btn'), msgs = document.getElementById('msgs');
  var form = document.getElementById('chatform'), input = document.getElementById('question'), chips = document.getElementById('chips');
  FAQ.forEach(function (f, i) {
    if (!f.chip) return;
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = f.q; b.dataset.i = i; chips.appendChild(b);
  });
  function show(on) {
    cb.classList.toggle('cb-open', on); toggle.setAttribute('aria-expanded', on ? 'true' : 'false');
    if (on) { msgs.scrollTop = msgs.scrollHeight; input.focus(); }
  }
  toggle.addEventListener('click', function () { show(!cb.classList.contains('cb-open')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') show(false); });
  // ---- voice: speak the question, hear the answer (Chrome and Edge) ----
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition, synth = window.speechSynthesis;
  var mic = document.getElementById('mic'), voiceBtn = document.getElementById('cb-voice'), readAloud = false;
  var GOOD = [/natural/i, /^google/i, /neural|premium|enhanced|siri/i, /samantha|karen|moira|tessa|veena|lekha|heera|neerja|swara/i];
  function bestVoice(lang) {
    var short = lang.slice(0, 2), list = synth.getVoices().filter(function (v) { return v.lang.replace('_', '-').slice(0, 2) === short; });
    function rank(v) {
      var name = v.name, r = GOOD.length;
      for (var i = 0; i < GOOD.length; i++) if (GOOD[i].test(name)) { r = i; break; }
      var region = v.lang.replace('_', '-') === lang ? 0 : /en-(GB|US)/.test(v.lang.replace('_', '-')) ? 1 : 2;
      return r * 10 + region + (/male/i.test(name) && !/female/i.test(name) ? 5 : 0);
    }
    list.sort(function (x, y) { return rank(x) - rank(y); });
    return list[0] || null;
  }
  if (synth && synth.getVoices) { synth.getVoices(); if ('onvoiceschanged' in synth) synth.onvoiceschanged = function () { synth.getVoices(); }; }
  function setRead(on) {
    readAloud = on;
    voiceBtn.classList.toggle('on', on);
    voiceBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    voiceBtn.textContent = (on ? '🔊 Read aloud: on' : '🔈 Read aloud: off');
    if (!on && synth) synth.cancel();
  }
  function say(text) {
    if (!synth || !readAloud || !text) return;
    synth.cancel();
    // Links and bullet marks are for the eyes, not the ears.
    text = text.replace(/:?\s*github\.com\/\S+/g, '.').replace(/[•*_#`>]/g, ' ').replace(/\s+/g, ' ').trim();
    var voice = bestVoice('en-IN');
    (text.match(/[^.!?\n]+[.!?]*/g) || [text]).forEach(function (piece) {
      piece = piece.trim();
      if (!piece) return;
      var u = new SpeechSynthesisUtterance(piece);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-IN';
      synth.speak(u);
    });
  }
  if (synth) { voiceBtn.style.display = 'block'; voiceBtn.addEventListener('click', function () { setRead(!readAloud); }); }
  if (Rec) {
    mic.style.display = 'grid';
    var rec = null;
    mic.addEventListener('click', function () {
      if (rec) { rec.stop(); return; }
      rec = new Rec(); rec.lang = 'en-IN'; rec.interimResults = true;
      var heard = '', box = document.getElementById('question');
      mic.classList.add('on'); box.placeholder = 'Listening…';
      rec.onresult = function (e) {
        heard = [].map.call(e.results, function (r) { return r[0].transcript; }).join(' ');
        box.value = heard;
      };
      rec.onerror = function (e) {
        if (e.error === 'not-allowed') add('bot', 'I need permission to use the microphone. Allow it in the address bar and try again.');
      };
      rec.onend = function () {
        rec = null; mic.classList.remove('on'); box.placeholder = 'Ask about Meeting Agent';
        if (heard.trim()) { box.value = ''; if (synth) setRead(true); reply(heard.trim()); }
      };
      rec.start();
    });
  }

  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches, typing = null;
  function add(cls, text, typed) {
    if (cls === 'bot' && typed) say(text);
    var d = document.createElement('div'); d.className = 'msg ' + cls;
    msgs.appendChild(d);
    if (typing) { clearInterval(typing.timer); typing.el.textContent = typing.text; typing = null; }   // finish the last one at once
    if (!typed || still) { d.textContent = text; msgs.scrollTop = msgs.scrollHeight; return; }
    var i = 0, step = Math.max(2, Math.ceil(text.length / 110));   // typed out; long answers type faster
    typing = {el: d, text: text, timer: setInterval(function () {
      i += step; d.textContent = text.slice(0, i); msgs.scrollTop = msgs.scrollHeight;
      if (i >= text.length) { clearInterval(typing.timer); typing = null; }
    }, 18)};
  }
  function find(text) {
    // Whole words only, and a longer matching phrase counts for more, so "about sameer" finds
    // "Who built this?" and not whichever answer happens to come first.
    var t = ' ' + text.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ') + ' ', best = null, top = 0;
    FAQ.forEach(function (f) {
      var n = 0;
      f.k.forEach(function (w) { if (t.indexOf(' ' + w + ' ') > -1) n += w.length; });
      // The app's own name appears in most questions, so it only counts when nothing more specific matched.
      if (!n && f.weak && f.weak.some(function (w) { return t.indexOf(' ' + w + ' ') > -1; })) n = 0.5;
      if (n && f.low) n = 0.7;      // a catch-all answer: any real topic in the sentence beats it
      if (n > top) { top = n; best = f; }
    });
    return best;
  }
  var NOIDEA = "Sorry, I can't answer that. I can only answer questions about Meeting Agent, like what it does, how to start, the cost, languages, privacy, the bot, reports, tasks, or who built it.";
  function noAnswer(text) {
    add('bot', NOIDEA, true);
    // Saved quietly (the text only), so the people who run Meeting Agent can add an answer for it later.
    try {
      fetch("{{ url_for('help_ask') }}", {method: 'POST', headers: {'Content-Type': 'application/json'},
                                          body: JSON.stringify({question: text})}).catch(function () {});
    } catch (e) {}
  }
  var lastTopic = null, toldMore = false;
  var MORE = /^\s*(tell me |show me |give me |i want |can i (know|get|have) |explain |say )?(some |a bit |a little )?(more|details?|detail me|elaborate|aur|aur batao|and\??|what else|anything else|continue|go on)\b.{0,25}$|\b(more about (this|it|that)|more (details?|info|information)|tell me more|in detail|explain more|aur batao)\b/i;
  function reply(text, entry) {
    add('user', text);
    var f = entry || find(text);
    if (!f && MORE.test(text)) {                 // "more about this": go deeper into the last topic
      var topic = lastTopic || FAQ[0];
      if (topic.more && !(toldMore && topic === lastTopic)) {
        lastTopic = topic; toldMore = true;
        add('bot', topic.more, true);
      } else {
        add('bot', 'That is all I have on that. You can ask about: what it does, how to start, the cost, languages, privacy, the bot, reports, the chatbot, recording, tasks, Telegram and calendar, or who built it.', true);
      }
      return;
    }
    if (!f) {
      for (var i = 0; i < TALK.length; i++) if (TALK[i][0].test(text) && text.trim().split(/\s+/).length <= 6) { add('bot', TALK[i][1], true); return; }
      noAnswer(text);
      return;
    }
    lastTopic = f; toldMore = false;
    add('bot', f.a, true);
  }
  chips.addEventListener('click', function (e) {
    if (e.target.classList.contains('chip')) reply(e.target.textContent, FAQ[e.target.dataset.i]);
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim(); if (!text) return;
    input.value = ''; reply(text);
  });
})();
</script>
