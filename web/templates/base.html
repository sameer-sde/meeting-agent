<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Meeting Agent{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1A17;--panel:#23221E;--panel2:#2A2925;--line:#35332E;--ink:#ECE8E1;--muted:#9A958C;--accent:#E08A5A;--live:#6FBF8E;--teams:#9B9CF5;--gold:#E3C26B;--stop:#D9654B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif}
a{color:var(--ink)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--muted)}
.serif{font-family:Newsreader,Georgia,serif;font-weight:400}
.brand{font-family:Newsreader,Georgia,serif;font-size:21px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.btn{font:600 14px Manrope,sans-serif;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--ink);color:#1B1A17;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.accent{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.stop{background:var(--stop);color:#fff}
.btn.danger{background:transparent;color:var(--stop);border:1px solid #5A3328}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local]{width:100%;font:14px Manrope,sans-serif;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);color-scheme:dark}
input::placeholder{color:#6F6B64}
.btn:focus-visible,input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--gold)}
label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:22px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13px}
p.hint{margin:0 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 36px;border-bottom:1px solid var(--line)}
.top nav{display:flex;gap:8px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.flash{margin:20px 36px 0;padding:12px 16px;border-radius:10px;background:#26302A;color:#B9E3C8;border:1px solid #33463A}
.warn{margin:20px 36px 0;padding:12px 16px;border-radius:10px;background:#33261F;color:#F0C6A8;border:1px solid #5A3B2A}
@media(max-width:900px){.top{padding:16px}.flash,.warn{margin:16px 16px 0}}
{% block css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
